<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'" />
        <title>Pickle Glass Header</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: transparent;
            }
            #ask-panel { overflow-y: auto; }
            #glass-overlay.conversation,
            #glass-overlay.expanded {
                background: rgba(11, 13, 17, 0.88);
                border-radius: 13px;
                outline: 1px solid rgba(255, 255, 255, 0.16);
                outline-offset: -1px;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div id="glass-overlay">
            <div id="header-container" tabindex="0" style="outline: none;"></div>
            <div id="ask-panel" hidden><ask-view embedded></ask-view></div>
        </div>

        <script type="module" src="../../../public/build/header.js"></script>
        <script>
            const params = new URLSearchParams(window.location.search);
            if (params.get('glass') === 'true') {
                document.body.classList.add('has-glass');
            }
        </script>
    </body>
</html>
